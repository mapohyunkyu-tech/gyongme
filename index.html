<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><link rel="manifest" href="manifest.webmanifest"><title>경매사 청과 1차 1098제</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#f4f6f8;color:#101828}.wrap{max-width:900px;margin:auto;padding:14px}.top{position:sticky;top:0;z-index:5;background:#f4f6f8ee;backdrop-filter:blur(10px);padding:8px 0}.hero,.card{background:white;border:1px solid #e4e7ec;border-radius:16px;padding:16px;box-shadow:0 2px 8px #0000000a}.hero h1{font-size:22px;margin:0 0 4px}.sub{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#f8fafc;padding:10px;border-radius:12px;text-align:center}.stat b{display:block;font-size:18px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}select,button{font:inherit;border:1px solid #d0d5dd;background:#fff;border-radius:10px;padding:10px 12px}button.primary{background:#17324d;color:#fff;border-color:#17324d}.card{margin-top:12px}.pill{display:inline-block;font-size:12px;background:#eef2f6;border-radius:999px;padding:5px 8px;margin-right:5px}.stem{font-size:19px;line-height:1.55}.stem.long{font-size:16px;line-height:1.45;font-weight:700;letter-spacing:-.25px}.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;line-height:1.45}.choice.ok{background:#ecfdf3;border-color:#079455}.choice.no{background:#fef3f2;border-color:#d92d20}.ex{display:none;border-top:1px solid #eaecf0;margin-top:14px;padding-top:12px;line-height:1.6;white-space:pre-wrap}.ex.long{font-size:14px;line-height:1.48}.ex.long .exbody{white-space:normal}.ex.long .exline{display:block;margin:0 0 6px}.ex.long .exsummary{display:block;margin-top:9px;padding-top:7px;border-top:1px dashed #d0d5dd;font-weight:600}.ex.show{display:block}.mem{margin-top:10px;padding:10px;background:#fffaeb;border-radius:10px}.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1}.tiny{font-size:12px;color:#667085}.progress{height:7px;background:#e4e7ec;border-radius:99px;overflow:hidden;margin-top:8px}.bar{height:100%;background:#17324d}.install{display:none}.resume{background:#0f766e;color:#fff;border-color:#0f766e}.danger{color:#b42318;border-color:#fda29b}.progressbox{margin-top:9px;padding:9px 10px;background:#f8fafc;border-radius:10px}.progressrow{display:grid;grid-template-columns:72px 1fr auto;gap:7px;align-items:center;font-size:12px;margin:5px 0}.mini{height:6px;background:#e4e7ec;border-radius:99px;overflow:hidden}.mini>i{display:block;height:100%;background:#17324d}.lastpos{font-size:12px;color:#475467;margin-top:7px;line-height:1.4}@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.wrap{padding:10px}.stem{font-size:17px}.stem.long{font-size:14.5px;line-height:1.42}.ex.long{font-size:13px;line-height:1.45}}</style></head><body><div class="wrap"><div class="top"><div class="hero"><h1>2027 경매사 청과 1차 · 1,098제 · 실전난도 v7</h1><div class="sub">농안법 288 · 유통론 310 · 상품성평가 500 · 오답/진도는 기기에 자동 저장</div><div class="grid"><div class=stat><b>288</b>농안법</div><div class=stat><b>310</b>유통론</div><div class=stat><b>500</b>상품성</div></div><div class=row><select id=subject><option value=ALL>전과목</option><option>농안법</option><option>유통론</option><option>상품성평가</option></select><select id=mode><option value=seq>전체 순서</option><option value=random>랜덤</option><option value=mock>실전 75문항</option><option value=mock25>과목 25문항</option><option value=wrong>오답만</option><option value=unseen>안 푼 문제</option></select><button class=primary onclick=start()>처음부터</button><button id=resumeBtn class=resume onclick=resumeSession()>이어풀기</button><button id=install class=install>앱 설치</button><button class=danger onclick=resetProgress()>기록 초기화</button></div><div id=subjectProgress class=progressbox></div><div class=tiny id=status></div></div></div><div id=app></div></div><script src="data.js"></script><script>
const DB=window.QUESTION_DB, K='auctioneer1070-v2';
let old=JSON.parse(localStorage.getItem('auctioneer1070-v1')||'null');
let state=JSON.parse(localStorage.getItem(K)||'null') || old || {wrong:[],seen:[],correct:0,total:0,session:null};
if(!('session' in state)) state.session=null;
let wrong=new Set(state.wrong||[]), seen=new Set(state.seen||[]), pool=[],pos=0,score=0,answered=false;
function save(){state.wrong=[...wrong];state.seen=[...seen];localStorage.setItem(K,JSON.stringify(state))}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makePool(s,m){let a=DB.filter(q=>s==='ALL'||q.subject===s);if(m==='wrong')a=a.filter(q=>wrong.has(q.uid));if(m==='unseen')a=a.filter(q=>!seen.has(q.uid));if(['random','mock','mock25'].includes(m))shuffle(a);if(m==='mock')a=a.slice(0,75);if(m==='mock25')a=a.slice(0,25);return a}
function start(){let s=subject.value,m=mode.value;pool=makePool(s,m);pos=0;score=0;state.session={subject:s,mode:m,poolUids:pool.map(q=>q.uid),pos:0,score:0,updated:Date.now()};save();render()}
function resumeSession(){let x=state.session;if(!x||!x.poolUids||!x.poolUids.length){alert('이어갈 학습 기록이 없어. 먼저 문제를 시작해줘.');return}let map=new Map(DB.map(q=>[q.uid,q]));pool=x.poolUids.map(id=>map.get(id)).filter(Boolean);pos=Math.min(x.pos||0,Math.max(0,pool.length-1));score=x.score||0;subject.value=x.subject||'ALL';mode.value=x.mode||'seq';render()}
function updateSession(){if(!state.session)return;state.session.pos=pos;state.session.score=score;state.session.updated=Date.now();save()}
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fmtLongEx(s){let t=esc(s||'');t=t.replace(/\s+(?=[ㄱㄴㄷㄹ①②③④]\s*[○×])/g,'<br>');t=t.replace(/\s+(?=핵심정리:)/g,'<br><br>');let a=t.split(/<br><br>|<br>/).filter(Boolean);return a.map(x=>x.startsWith('핵심정리:')?'<span class=exsummary>'+x+'</span>':'<span class=exline>'+x+'</span>').join('')}
function progressHTML(){let subjects=[['농안법',288],['유통론',310],['상품성평가',500]];let rows=subjects.map(([name,total])=>{let done=DB.filter(q=>q.subject===name&&seen.has(q.uid)).length,p=Math.round(done/total*100);return `<div class=progressrow><b>${name==='상품성평가'?'상품성':name}</b><div class=mini><i style="width:${p}%"></i></div><span>${done}/${total}</span></div>`}).join('');let last='이어풀기 기록 없음';if(state.session&&state.session.poolUids&&state.session.poolUids.length){let sn=state.session.subject==='ALL'?'전과목':state.session.subject, mn={'seq':'전체 순서','random':'랜덤','mock':'실전 75문항','mock25':'과목 25문항','wrong':'오답만','unseen':'안 푼 문제'}[state.session.mode]||state.session.mode;last=`마지막 위치: ${sn} · ${mn} · ${(state.session.pos||0)+1}/${state.session.poolUids.length}문제`;}return rows+`<div class=lastpos>${last}</div>`}
function renderHeader(){subjectProgress.innerHTML=progressHTML();status.textContent=`누적 풀이 ${state.total||0} · 누적 정답 ${state.correct||0} · 오답 ${wrong.size} · 미풀이 ${DB.length-seen.size}`;resumeBtn.style.display=(state.session&&state.session.poolUids&&state.session.poolUids.length)?'inline-block':'none'}
function render(){renderHeader();if(!pool.length){app.innerHTML='<div class=card>해당 조건의 문제가 없어.</div>';return}if(pos>=pool.length){app.innerHTML=`<div class=card><h2>완료</h2><p>${pool.length}문항 중 ${score}문항 정답 · ${Math.round(score/pool.length*100)}점</p><button class=primary onclick=start()>다시 풀기</button></div>`;return}answered=false;let q=pool[pos],pct=(pos/pool.length*100).toFixed(1),longStem=(q.stem||'').length>=180,longEx=(q.explanation||'').length>=250;app.innerHTML=`<div class=card><span class=pill>${esc(q.subject)}</span><span class=pill>${esc(q.part_name||q.part_id)}</span><span class=pill>${pos+1}/${pool.length}</span><div class=progress><div class=bar style="width:${pct}%"></div></div><h2 class="stem${longStem?' long':''}">${esc(q.stem)}</h2>${q.choices.map((c,i)=>`<button class=choice onclick="pick(${i+1},this)">${i+1}. ${esc(c)}</button>`).join('')}<div id=ex class="ex${longEx?' long':''}"><b>정답 ${q.answer}번</b><div class=exbody>${longEx?fmtLongEx(q.explanation):esc(q.explanation)}</div>${q.memory?`<div class=mem><b>헷갈림 암기</b> · ${esc(q.memory)}</div>`:''}${q.past_refs&&q.past_refs.length?`<div class=tiny>기출축: ${esc(q.past_refs.join(', '))}</div>`:''}</div><div class=nav><button onclick=prev()>이전</button><button onclick=next()>다음</button></div></div>`;updateSession()}
function pick(n){if(answered)return;answered=true;let q=pool[pos],bs=[...document.querySelectorAll('.choice')];bs.forEach((b,i)=>{if(i+1===q.answer)b.classList.add('ok');else if(i+1===n)b.classList.add('no')});seen.add(q.uid);state.total=(state.total||0)+1;if(n===q.answer){score++;state.correct=(state.correct||0)+1;wrong.delete(q.uid)}else wrong.add(q.uid);updateSession();ex.classList.add('show');renderHeader()}
function next(){if(pos<pool.length-1){pos++;updateSession();render()}else if(pos===pool.length-1){pos++;updateSession();render()}}
function prev(){if(pos>0){pos--;updateSession();render()}}
function resetProgress(){if(!confirm('진도, 오답, 누적 기록, 이어풀기 위치를 모두 초기화할까?'))return;state={wrong:[],seen:[],correct:0,total:0,session:null};wrong=new Set();seen=new Set();pool=[];pos=0;score=0;save();renderHeader();app.innerHTML='<div class=card>학습 기록을 초기화했어. 과목과 모드를 선택하고 시작하면 돼.</div>'}
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.style.display='inline-block'});install.onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;install.style.display='none'}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});renderHeader();if(state.session&&state.session.poolUids&&state.session.poolUids.length)resumeSession();else start();
</script></body></html>
